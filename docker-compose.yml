version: '3.8'

networks:
  smarttask-net:
    driver: bridge

volumes:
  db-data:

services:
  database:
    image: mysql:8.0
    container_name: smarttask-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smarttask_db
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - smarttask-net

  backend:
    build: ./backend
    container_name: smarttask-backend
    restart: always
    environment:
      DB_HOST: database
      DB_USER: user
      DB_PASSWORD: userpassword
      DB_NAME: smarttask_db
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - database
    networks:
      - smarttask-net

  frontend:
    build: ./frontend
    container_name: smarttask-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smarttask-net
